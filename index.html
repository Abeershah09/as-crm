function emptyData(){let s=seed();for(const k of ['clients','leads','tasks','socials','proposals','invoices','payments','expenses'])s[k]=[];return s}
function readSaved(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.clients)&&Array.isArray(d.leads)&&Array.isArray(d.invoices))return d;let v1=JSON.parse(localStorage.getItem('as_crm_v1')||'null');if(v1&&Array.isArray(v1.leads)&&Array.isArray(v1.tasks)){let d=emptyData();d.leads=v1.leads;d.tasks=v1.tasks.map(t=>({...t,clientId:t.clientId||''}));d.clients=v1.leads.filter(l=>l.stage==='Won').map(l=>({id:uid(),name:l.contact,brand:l.company,email:l.email||'',phone:l.phone||'',address:'',status:'Active',startDate:l.created||iso(),notes:l.notes||''}));return d}}catch(err){console.warn('Storage parsing failed',err)}return seed()}
let data=readSaved(),page='dashboard',selectedClientId='',clientTab='overview',search='',stageFilter='All',taskFilter='Open';
function navigate(p,id=''){page=p;search='';stageFilter='All';if(p==='client'){selectedClientId=id||selectedClientId;clientTab='overview'}render();updateMobileNav();closeMobileMenu();window.scrollTo({top:0,behavior:'smooth'})}
const pages={dashboard:['Business Overview','Your clients, income and important activity at a glance.'],leads:['Lead Management','Track incoming business and opportunities.'],pipeline:['Sales Pipeline','Move leads between sales stages.'],clients:['Clients','Every brand, contact and business relationship in one place.'],client:['Client Profile','Accounts, proposals, invoices and lifetime earnings.'],socials:['Social Accounts','Keep all client social media profiles organized.'],proposals:['Proposals','Build quotations, share PDFs and convert approvals into invoices.'],invoices:['Invoices & Payments','Track dues, deposits and payment reminders.'],expenses:['Expenses','Understand project costs and profitability.'],tasks:['Follow-ups','Stay ahead of calls, deadlines and client tasks.'],reports:['Reports & Profitability','Cash-based financial performance and client lifetime value.'],settings:['Settings & Data','Workspace information and local backups.']};
const actions={dashboard:()=>btn('New Client','openClient()',true,'plus'),clients:()=>btn('Add Client','openClient()',true,'plus'),client:()=>btn('Edit Client',`openClient('${selectedClientId}')`,true,'edit'),leads:()=>btn('Add Lead','openLead()',true,'plus'),pipeline:()=>btn('Add Lead','openLead()',true,'plus'),socials:()=>btn('Add Social Account','openSocial()',true,'plus'),proposals:()=>btn('New Proposal','openProposal()',true,'plus'),invoices:()=>btn('New Invoice','openInvoice()',true,'plus'),expenses:()=>btn('Record Expense','openExpense()',true,'plus'),tasks:()=>btn('Add Task','openTask()',true,'plus'),reports:()=>btn('Export Report CSV','exportReport()',false,'download'),settings:()=>''};
function render(){for(const [target,list] of Object.entries(navGroups)){document.getElementById(target).innerHTML=list.map(([p,name,icon])=>`<button class="navbtn ${(page===p||(page==='client'&&p==='clients'))?'active':''}" onclick="navigate('${p}')">${svg(icon)}<span>${e(name)}</span></button>`).join('')}
 document.getElementById('dateLabel').textContent=' / '+new Date().toLocaleDateString('en-PK',{month:'long',year:'numeric'});document.getElementById('pageTitle').textContent=pages[page]?.[0]||'Overview';document.getElementById('pageSub').textContent=pages[page]?.[1]||'';document.getElementById('topActions').innerHTML=actions[page]?.()||'';
 const content={dashboard:renderDashboard,leads:renderLeads,pipeline:renderPipeline,clients:renderClients,client:renderClient,socials:renderSocials,proposals:renderProposals,invoices:renderInvoices,expenses:renderExpenses,tasks:renderTasks,reports:renderReports,settings:renderSettings};document.getElementById('appContent').innerHTML=(content[page]||renderDashboard)();}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalContent').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.body.classList.add('modal-open');document.getElementById('modalContent').scrollTop=0}
function closeModal(){document.getElementById('modalBack').classList.remove('show');document.body.classList.remove('modal-open')}
document.getElementById('modalBack').addEventListener('click',ev=>{if(ev.target.id==='modalBack')closeModal()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
function readForm(form){return Object.fromEntries(new FormData(form).entries())}
function saveChanges(message){save();closeModal();render();toast(message)}
// DASHBOARD
function recentInvoiceRow(inv){let c=client(inv.clientId);return `<tr><td><button class="taplink" onclick="viewInvoice('${inv.id}')">${e(inv.number)}</button><div class="row-sub">${e(c?.brand||'Unknown')}</div></td><td>${fmtDate(inv.dueDate)}</td><td>${money(subtotal(inv.items))}</td><td>${money(due(inv))}</td><td>${statusBadge(invStatus(inv))}</td><td><div class="inline-actions">${btn('View',`viewInvoice('${inv.id}')`)}${due(inv)>0?btn('WhatsApp',`sendWhatsApp('${inv.id}')`,false,'message'):''}</div></td></tr>`}
function renderDashboard(){const dueInv=data.invoices.filter(x=>due(x)>0).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));const overdue=dueInv.filter(x=>x.dueDate&&x.dueDate<iso());const net=received()-totalExpense();const hot=data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,4);
 return `<div class="blue-head"><div><div class="title-in">A clearer view of your business.</div><p>Follow up on client payments, keep work organized and see what your agency earns.</p></div>${btn('Create Invoice','openInvoice()',false,'plus')}</div><section class="metrics">${metric('Payments Received',money(received()),'Actual money recorded','wallet','green')}${metric('Outstanding',money(outstanding()),`${dueInv.length} unpaid or partial invoices`,'clock','orange')}${metric('Total Expenses',money(totalExpense()),'Recorded business expenses','receipt','red')}${metric('Cash Surplus',money(net),'Receipts minus expenses (before tax)','trend',net>=0?'green':'red')}</section>
 <div class="two-col"><section class="panel"><div class="panelhead"><div><h2>Upcoming & overdue payments</h2><p>Click an invoice to view details or send a reminder</p></div><button class="btn small" onclick="navigate('invoices')">All invoices ${svg('arrow')}</button></div><div class="tablewrap"><table class="data-table" style="min-width:620px"><thead><tr><th>Invoice / Client</th><th>Due</th><th>Amount</th><th>Balance</th><th>Status</th><th>Action</th></tr></thead><tbody>${dueInv.slice(0,5).map(recentInvoiceRow).join('')||'<tr><td colspan="6"><div class="empty">No outstanding invoices. You are all caught up.</div></td></tr>'}</tbody></table></div></section>
 <section class="panel"><div class="panelhead"><div><h2>Quick actions</h2><p>Everything you need to keep business moving</p></div></div><div class="panelbody"><div class="option-grid"><button class="option" onclick="openClient()">${svg('users')}<div class="row-title" style="margin-top:9px">New Client</div><div class="row-sub">Add contact & brand</div></button><button class="option" onclick="openProposal()">${svg('file')}<div class="row-title" style="margin-top:9px">New Proposal</div><div class="row-sub">Services & quotation</div></button><button class="option" onclick="openInvoice()">${svg('wallet')}<div class="row-title" style="margin-top:9px">New Invoice</div><div class="row-sub">Bill and track dues</div></button><button class="option" onclick="openExpense()">${svg('receipt')}<div class="row-title" style="margin-top:9px">Record Expense</div><div class="row-sub">Track project costs</div></button></div><div class="splitline"></div><div class="kpi-line"><div><div class="small-label">Active clients</div><div class="number" style="font-size:20px;font-weight:800;margin-top:8px">${data.clients.filter(x=>x.status==='Active').length}</div></div><div><div class="small-label">Managed accounts</div><div class="number" style="font-size:20px;font-weight:800;margin-top:8px">${data.socials.length}</div></div><div><div class="small-label">Overdue invoices</div><div class="number" style="font-size:20px;font-weight:800;margin-top:8px;color:${overdue.length?'#cb5363':'inherit'}">${overdue.length}</div></div></div></div></section></div>
 <div class="two-col section-space"><section class="panel"><div class="panelhead"><div><h2>Client earnings</h2><p>Actual received payments, all time</p></div><button class="btn small" onclick="navigate('reports')">All reports ${svg('arrow')}</button></div><div class="panelbody">${data.clients.slice().sort((a,b)=>clReceived(b.id)-clReceived(a.id)).slice(0,5).map(c=>{let max=Math.max(1,...data.clients.map(x=>clReceived(x.id)));return `<div class="chartrow"><div class="chartname" style="width:138px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(c.brand)}</div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,100*clReceived(c.id)/max))}%"></div></div><div class="chartnum" style="width:100px">${money(clReceived(c.id))}</div></div>`}).join('')||'<div class="empty">Add clients and record payments to see their earnings.</div>'}</div></section><section class="panel"><div class="panelhead"><div><h2>Priority follow-ups</h2><p>Keep important deadlines visible</p></div><button class="btn small" onclick="navigate('tasks')">All tasks ${svg('arrow')}</button></div><div class="panelbody">${hot.map(t=>`<div class="linkrow"><div class="linkrow-content"><div class="social-mark">${svg('calendar')}</div><div><div class="row-title">${e(t.title)}</div><div class="row-sub">${e(client(t.clientId)?.brand||lead(t.leadId)?.company||'General task')}</div></div></div><span class="due ${t.due<iso()?'overdue':''}">${fmtDate(t.due)}</span></div>`).join('')||'<div class="empty">No tasks pending.</div>'}</div></section></div>`}
// LEADS & PIPELINE
function renderLeads(){const list=data.leads.filter(l=>(stageFilter==='All'||l.stage===stageFilter)&&[l.company,l.contact,l.email,l.phone,l.source].some(v=>String(v||'').toLowerCase().includes(search.toLowerCase())));return `<div class="tools"><div class="tools-left"><div class="searchwrap">${svg('search')}<input class="search" value="${e(search)}" placeholder="Search leads..." oninput="search=this.value;refreshLeads()"></div><select class="select" onchange="stageFilter=this.value;refreshLeads()">${['All',...stages].map(s=>`<option value="${s}" ${s===stageFilter?'selected':''}>${s==='All'?'All stages':s}</option>`).join('')}</select></div></div><div id="leadtable">${leadsTable(list)}</div>`}
function leadsTable(list){return table(['Contact','Company','Stage','Potential Value','Next Follow-up','Actions'],list.map(l=>`<tr><td><strong>${e(l.contact)}</strong><div class="row-sub">${e(l.email)}</div></td><td>${e(l.company)}</td><td>${statusBadge(l.stage)}</td><td><strong>${money(l.value)}</strong></td><td>${fmtDate(l.followup)}</td><td><div class="inline-actions"><button class="btn small" onclick="openLead('${l.id}')">Edit</button><button class="btn small danger" onclick="deleteLead('${l.id}')">Delete</button></div></td></tr>`),'No leads here yet.')}
function refreshLeads(){const list=data.leads.filter(l=>(stageFilter==='All'||l.stage===stageFilter)&&[l.company,l.contact,l.email,l.phone,l.source].some(v=>String(v||'').toLowerCase().includes(search.toLowerCase())));document.getElementById('leadtable').innerHTML=leadsTable(list)}
function renderPipeline(){return `<div class="notice">Drag leads between stages. Marked “Won” leads can be converted into clients using the form below.</div><div class="pipeline">${stages.filter(s=>s!=='Lost').map(s=>{const ls=data.leads.filter(l=>l.stage===s);return `<div class="pipe-col" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="dropLead(event,'${s}');this.classList.remove('dragover')"><div class="pipe-title"><strong>${s} ${badge(ls.length)}</strong><small>${money(sum(ls,l=>l.value))}</small></div>${ls.map(l=>`<div draggable="true" class="pipe-card" ondragstart="event.dataTransfer.setData('text/plain','${l.id}')"><div class="companyname">${e(l.company)}</div><p>${e(l.contact)} · ${e(l.source)}</p><div class="pipe-foot"><span>${money(l.value)}</span><button onclick="openLead('${l.id}')">Edit</button></div></div>`).join('')||'<div class="empty">Drop lead here</div>'}</div>`}).join('')}</div>`}
function dropLead(ev,st){ev.preventDefault();const l=lead(ev.dataTransfer.getData('text/plain'));if(!l)return;l.stage=st;save();render();toast('Lead moved to '+st)}
function openLead(id=''){let l=lead(id)||{contact:'',company:'',email:'',phone:'',value:0,stage:'New',source:'Instagram',followup:iso(3),notes:''};openModal(id?'Edit Lead':'Add Lead',`<form onsubmit="submitLead(event,'${id}')"><div class="formgrid">${field('Contact name *','contact',l.contact,'text','required maxlength="100"')}${field('Company / Brand *','company',l.company,'text','required maxlength="100"')}${field('Email','email',l.email,'email')}${field('Phone','phone',l.phone,'tel')}${field('Potential value (PKR)','value',l.value,'number','min="0" step="1"')}${field('Follow-up date','followup',l.followup,'date')}${selectField('Sales stage','stage',stages,l.stage)}${selectField('Source','source',['Instagram','Facebook','Website','LinkedIn','Referral','Call','Other'],l.source)}${textField('Notes','notes',l.notes)}</div>${footer('Save Lead',id?`<button class="btn small" type="button" onclick="convertLead('${id}')">Convert to Client</button>`:'')}</form>`)}
function submitLead(ev,id){ev.preventDefault();const f=readForm(ev.target);if(!f.contact.trim()||!f.company.trim())return;const item={...lead(id),id:id||uid(),contact:f.contact.trim(),company:f.company.trim(),email:f.email.trim(),phone:f.phone.trim(),value:num(f.value),stage:f.stage,source:f.source,followup:f.followup,notes:f.notes.trim(),created:lead(id)?.created||iso()};if(id)data.leads=data.leads.map(l=>l.id===id?item:l);else data.leads.unshift(item);saveChanges(id?'Lead updated':'Lead added')}
function convertLead(id){const l=lead(id);if(!l)return;closeModal();openClient('',{name:l.contact,brand:l.company,email:l.email,phone:l.phone,notes:l.notes});toast('Confirm this client information and save')}
function deleteLead(id){if(!confirm('Delete this lead?'))return;data.leads=data.leads.filter(x=>x.id!==id);data.tasks=data.tasks.filter(t=>t.leadId!==id);save();render();toast('Lead deleted')}
// CLIENTS
function renderClients(){let list=data.clients.filter(c=>[c.name,c.brand,c.email,c.phone,c.address].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));return `<div class="tools"><div class="tools-left"><div class="searchwrap">${svg('search')}<input class="search" value="${e(search)}" placeholder="Search clients or brands..." oninput="search=this.value;refreshClients()"></div></div><div class="tools-right"><span class="muted">${data.clients.length} total clients</span></div></div><div id="clientcards">${clientCards(list)}</div>`}
function clientCards(list){return list.length?`<div class="client-grid">${list.map(c=>`<div class="clientcard"><div class="kpi-line"><div class="avatar" style="width:45px;height:45px;border-radius:12px;font-size:15px">${e(initials(c.brand))}</div>${statusBadge(c.status)}</div><h3 style="margin:15px 0 5px">${e(c.brand)}</h3><div class="sub">${e(c.name)} · ${e(c.email||'No email')}</div><div style="margin-top:19px" class="small-label">Lifetime received</div><div class="clientval" style="margin:8px 0 13px">${money(clReceived(c.id))}</div><div class="kpi-line" style="margin-bottom:17px"><div><div class="small-label">Outstanding</div><strong>${money(clDue(c.id))}</strong></div><div><div class="small-label">Social profiles</div><strong>${data.socials.filter(s=>s.clientId===c.id).length}</strong></div></div><div class="clientfoot"><button class="btn small primary" onclick="navigate('client','${c.id}')">Open Profile ${svg('arrow')}</button><button class="btn small" onclick="openClient('${c.id}')">Edit</button></div></div>`).join('')}</div>`:'<div class="empty-block">No clients found. Add a client to get started.</div>'}
function refreshClients(){const list=data.clients.filter(c=>[c.name,c.brand,c.email,c.phone,c.address].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));document.getElementById('clientcards').innerHTML=clientCards(list)}
function openClient(id='',prefill={}){const c=client(id)||{name:'',brand:'',email:'',phone:'',address:'',startDate:iso(),status:'Active',notes:'',...prefill};openModal(id?'Edit Client':'New Client',`<form onsubmit="submitClient(event,'${id}')"><div class="formgrid">${field('Client contact name *','name',c.name,'text','required maxlength="120"')}${field('Brand / Business name *','brand',c.brand,'text','required maxlength="120"')}${field('Email address','email',c.email,'email','maxlength="200"')}${field('WhatsApp / Phone','phone',c.phone,'tel','maxlength="35"')}${field('Billing address','address',c.address,'text','maxlength="300"',true)}${field('Client since','startDate',c.startDate,'date')}${selectField('Client status','status',['Active','Inactive','On Hold'],c.status)}${textField('Client notes','notes',c.notes||'','maxlength="3000"')}</div>${footer('Save Client',id?`<button class="btn danger small" type="button" onclick="deleteClient('${id}')">Delete</button>`:'')}</form>`)}
function submitClient(ev,id){ev.preventDefault();let f=readForm(ev.target);if(!f.name.trim()||!f.brand.trim())return;const c={id:id||uid(),name:f.name.trim(),brand:f.brand.trim(),email:f.email.trim(),phone:f.phone.trim(),address:f.address.trim(),startDate:f.startDate,status:f.status,notes:f.notes.trim()};if(id)data.clients=data.clients.map(x=>x.id===id?c:x);else data.clients.unshift(c);saveChanges(id?'Client updated':'Client added')}
function deleteClient(id){if(data.invoices.some(x=>x.clientId===id)||data.proposals.some(x=>x.clientId===id)||data.expenses.some(x=>x.clientId===id)){alert('This client has financial records. Keep the history and set the client to Inactive instead.');return}if(!confirm('Delete client and their social links / tasks?'))return;data.clients=data.clients.filter(c=>c.id!==id);data.socials=data.socials.filter(s=>s.clientId!==id);data.tasks=data.tasks.filter(t=>t.clientId!==id);selectedClientId='';page='clients';saveChanges('Client deleted')}
function renderClient(){const c=client(selectedClientId);if(!c)return '<div class="empty-block">Client not found. <button class="btn" onclick="navigate(\'clients\')">All clients</button></div>';const tabs=[['overview','Overview'],['social','Social Accounts'],['proposals','Proposals'],['invoices','Invoices & Payments'],['expenses','Expenses']];return `<div class="panel" style="padding:20px 24px;margin-bottom:19px"><div class="kpi-line"><div class="client-hero"><div class="avatar">${e(initials(c.brand))}</div><div><h2>${e(c.brand)}</h2><p>${e(c.name)} · ${e(c.email||'No email')}</p></div></div><div class="inline-actions">${statusBadge(c.status)}<button class="btn small" onclick="openClient('${c.id}')">${svg('edit')} Edit Details</button></div></div><div class="info-grid" style="margin-top:21px"><div class="mini-kpi"><div class="small-label">Lifetime billed</div><b>${money(clBilled(c.id))}</b><small>Total invoice value</small></div><div class="mini-kpi"><div class="small-label">Lifetime received</div><b>${money(clReceived(c.id))}</b><small>Payments on record</small></div><div class="mini-kpi"><div class="small-label">Outstanding</div><b style="color:#b98627">${money(clDue(c.id))}</b><small>Pending invoice balance</small></div><div class="mini-kpi"><div class="small-label">Direct expenses</div><b>${money(clExpenses(c.id))}</b><small>Assigned to this client</small></div><div class="mini-kpi"><div class="small-label">Cash contribution</div><b style="color:${clReceived(c.id)-clExpenses(c.id)<0?'#c24c60':'#258866'}">${money(clReceived(c.id)-clExpenses(c.id))}</b><small>Received less direct expenses</small></div><div class="mini-kpi"><div class="small-label">Social accounts</div><b>${data.socials.filter(s=>s.clientId===c.id).length}</b><small>Saved profile links</small></div></div></div><div class="subnav">${tabs.map(([id,label])=>`<button class="${clientTab===id?'active':''}" onclick="clientTab='${id}';render()">${label}</button>`).join('')}</div>${({overview:()=>clientOverview(c),social:()=>clientSocial(c),proposals:()=>clientProposals(c),invoices:()=>clientInvoices(c),expenses:()=>clientExpenses(c)}[clientTab])()}`}
function clientOverview(c){let inv=clInvoices(c.id),acc=data.socials.filter(s=>s.clientId===c.id);return `<div class="two-col"><section class="panel"><div class="panelhead"><h2>Client Information</h2></div><div class="panelbody">${[['Contact person',c.name],['Brand / Company',c.brand],['Email',c.email||'—'],['Phone / WhatsApp',c.phone||'—'],['Billing address',c.address||'—'],['Client since',fmtDate(c.startDate)],['Notes',c.notes||'—']].map(([a,b])=>`<div class="list-values"><span class="key">${e(a)}</span><span class="val">${e(b)}</span></div>`).join('')}</div></section><section class="panel"><div class="panelhead"><div><h2>Social media accounts</h2><p>Platforms you manage for this brand</p></div><button class="btn small" onclick="openSocial('','${c.id}')">+ Add</button></div><div class="panelbody">${acc.map(s=>socialRow(s)).join('')||'<div class="empty">No social media links yet.</div>'}<button class="btn small" style="margin-top:15px" onclick="clientTab='social';render()">View All</button></div></section></div><div class="panel section-space"><div class="panelhead"><div><h2>Recent invoices</h2><p>Payments and balances for this client</p></div><button class="btn small" onclick="openInvoice('','${c.id}')">+ New Invoice</button></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Invoice</th><th>Due date</th><th>Total</th><th>Outstanding</th><th>Status</th><th>Action</th></tr></thead><tbody>${inv.slice().reverse().slice(0,6).map(recentInvoiceRow).join('')||'<tr><td colspan="6"><div class="empty">No invoices for this client.</div></td></tr>'}</tbody></table></div></div>`}
function clientSocial(c){const l=data.socials.filter(s=>s.clientId===c.id);return `<div class="panel"><div class="panelhead"><div><h2>Connected profile list</h2><p>Saved links only. OAuth connections are not active in this demo.</p></div><button class="btn small primary" onclick="openSocial('','${c.id}')">+ Add Social</button></div><div class="panelbody">${l.map(s=>socialRow(s)).join('')||'<div class="empty">No social accounts added yet.</div>'}</div></div>`}
function clientProposals(c){const l=data.proposals.filter(p=>p.clientId===c.id);return `<div class="tools"><div class="tools-right">${btn('Create Proposal',`openProposal('','${c.id}')`,true,'plus')}</div></div>${proposalsTable(l)}`}
function clientInvoices(c){return `<div class="tools"><div class="tools-right">${btn('New Invoice',`openInvoice('','${c.id}')`,true,'plus')}</div></div>${invoicesTable(clInvoices(c.id))}`}
function clientExpenses(c){return `<div class="tools"><div class="tools-right">${btn('Add Expense',`openExpense('','${c.id}')`,true,'plus')}</div></div>${expensesTable(data.expenses.filter(x=>x.clientId===c.id))}`}
// SOCIAL ACCOUNT DIRECTORY
const platforms=['Instagram','Facebook','TikTok','YouTube','LinkedIn','Pinterest','X / Twitter','Website','Other'];
function socialRow(s,withClient=false){const c=client(s.clientId);return `<div class="linkrow"><div class="linkrow-content"><div class="social-mark ${e(s.platform.toLowerCase().split(' ')[0])}">${e(s.platform.slice(0,2).toUpperCase())}</div><div style="min-width:0"><div class="row-title">${e(s.platform)} · ${e(s.handle||'No handle')}</div><div class="row-sub">${withClient?e(c?.brand||'Unknown')+' · ':''}${e(s.brand||c?.brand||'')} ${s.managedBy?'· Managed by '+e(s.managedBy):''}</div></div></div><div class="inline-actions">${statusBadge(s.access||'Link saved')}${aSafe(s.url,'Open')}<button class="btn small" onclick="openSocial('${s.id}')">Edit</button></div></div>`}
function renderSocials(){const l=data.socials.filter(s=>[s.platform,s.handle,s.brand,s.managedBy,client(s.clientId)?.brand].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));return `<div class="notice"><strong>Link management:</strong> Accounts below are saved profile URLs, not authenticated social media integrations. Analytics and automatic publishing require official platform authorization.</div><div class="tools"><div class="tools-left"><div class="searchwrap">${svg('search')}<input class="search" value="${e(search)}" placeholder="Search platform, brand or handle..." oninput="search=this.value;refreshSocials()"></div></div><span class="muted">${data.socials.length} saved profiles</span></div><section class="panel"><div class="panelhead"><div><h2>Social media accounts</h2><p>All managed profiles across clients</p></div></div><div class="panelbody" id="socialList">${l.map(s=>socialRow(s,true)).join('')||'<div class="empty">Add your first social media account.</div>'}</div></section>`}
function refreshSocials(){let l=data.socials.filter(s=>[s.platform,s.handle,s.brand,s.managedBy,client(s.clientId)?.brand].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));document.getElementById('socialList').innerHTML=l.map(s=>socialRow(s,true)).join('')||'<div class="empty">No matching social accounts.</div>'}
function openSocial(id='',clientId=''){if(!data.clients.length){toast('Add a client before saving social accounts');openClient();return}const s=data.socials.find(x=>x.id===id)||{clientId,brand:client(clientId)?.brand||'',platform:'Instagram',handle:'',url:'',managedBy:'AS Tech Agency',access:'Link saved',started:iso()};openModal(id?'Edit Social Account':'Add Social Account',`<form onsubmit="submitSocial(event,'${id}')"><div class="formgrid">${clientSelect(s.clientId)}${selectField('Platform','platform',platforms,s.platform)}${field('Brand / Page name','brand',s.brand)}${field('Username / Handle','handle',s.handle,'text','maxlength="140"')}${field('Profile link (https://...) *','url',s.url,'url','required placeholder="https://instagram.com/brand"',true)}${field('Account managed by','managedBy',s.managedBy)}${selectField('Access status','access',['Link saved','Access requested','Access granted','Access removed'],s.access)}${field('Management start date','started',s.started,'date')}</div><div class="formnote">Never save Facebook/Instagram passwords here. Direct integration requires permission-based API authorization.</div>${footer('Save Account',id?`<button class="btn danger small" type="button" onclick="deleteSocial('${id}')">Delete</button>`:'')}</form>`)}
function submitSocial(ev,id){ev.preventDefault();let f=readForm(ev.target);const url=validUrl(f.url);if(!url){alert('Use a valid http:// or https:// account link.');return}if(!client(f.clientId)){alert('Please choose a client');return}const s={id:id||uid(),clientId:f.clientId,brand:f.brand.trim(),platform:f.platform,handle:f.handle.trim(),url,managedBy:f.managedBy.trim(),access:f.access,started:f.started};if(id)data.socials=data.socials.map(x=>x.id===id?s:x);else data.socials.unshift(s);saveChanges(id?'Social account updated':'Social account saved')}
function deleteSocial(id){if(!confirm('Delete this social media link?'))return;data.socials=data.socials.filter(x=>x.id!==id);saveChanges('Social account deleted')}
// PROPOSALS & QUOTATIONS
let itemRows=0;
function formItems(items=[]){itemRows=0;return `<div class="field full"><label>Services / line items *</label><div class="line-items"><div class="line-items-head"><span>Service / Description</span><span>Qty</span><span>Rate (PKR)</span><span></span></div><div id="itemsBox">${(items.length?items:[{name:'',qty:1,rate:0}]).map(x=>lineItem(x)).join('')}</div></div><div class="kpi-line" style="margin-top:10px"><button class="btn small" type="button" onclick="appendItem()">${svg('plus')} Add service</button><div class="form-sum">Total: <span id="itemsTotal">${money(subtotal(items))}</span></div></div></div>`}
function lineItem(item){const n=itemRows++;return `<div class="line-items-row" id="itemRow${n}"><input aria-label="Service" name="itemName" maxlength="240" placeholder="e.g. Social Media Management" value="${e(item.name||'')}" required oninput="updateItemsTotal()"><input aria-label="Quantity" name="itemQty" type="number" min="0.01" step="0.01" value="${e(item.qty??1)}" required oninput="updateItemsTotal()"><input aria-label="Rate" name="itemRate" type="number" min="0" step="0.01" value="${e(item.rate??0)}" required oninput="updateItemsTotal()"><button type="button" aria-label="Remove service" onclick="removeItem(${n})">✕</button></div>`}
function appendItem(){document.getElementById('itemsBox').insertAdjacentHTML('beforeend',lineItem({name:'',qty:1,rate:0}));updateItemsTotal()}
function removeItem(n){let rows=document.querySelectorAll('#itemsBox .line-items-row');if(rows.length<=1){toast('Keep at least one line item');return}document.getElementById('itemRow'+n)?.remove();updateItemsTotal()}
function readItems(){return [...document.querySelectorAll('#itemsBox .line-items-row')].map(row=>({name:row.querySelector('[name=itemName]').value.trim(),qty:num(row.querySelector('[name=itemQty]').value),rate:num(row.querySelector('[name=itemRate]').value)}))}
function updateItemsTotal(){const el=document.getElementById('itemsTotal');if(el)el.textContent=money(subtotal(readItems()))}
function nextDoc(prefix,docs){let max=Math.max(0,...docs.map(d=>Number((d.number||'').split('-').pop())||0));return `${prefix}-${String(max+1).padStart(4,'0')}`}
function proposalsTable(list){return table(['Proposal','Client','Date','Total','Status','Actions'],list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td><button class="taplink" onclick="viewProposal('${p.id}')">${e(p.number)}</button><div class="row-sub">${e(p.items[0]?.name||'Quotation')}</div></td><td>${e(client(p.clientId)?.brand||'Unknown')}</td><td>${fmtDate(p.date)}</td><td><strong>${money(subtotal(p.items))}</strong></td><td>${statusBadge(p.status)}</td><td><div class="inline-actions"><button class="btn small" onclick="viewProposal('${p.id}')">View</button><button class="btn small" onclick="openProposal('${p.id}')">Edit</button><button class="btn small" onclick="convertProposal('${p.id}')">Invoice</button></div></td></tr>`),'No proposals created yet.')}
function renderProposals(){const s=data.proposals.filter(p=>[p.number,client(p.clientId)?.brand,p.status,p.scope].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));return `<div class="tools"><div class="tools-left"><div class="searchwrap">${svg('search')}<input class="search" value="${e(search)}" placeholder="Search proposals..." oninput="search=this.value;refreshProposals()"></div></div><span class="muted">${data.proposals.length} proposals</span></div><div id="propTable">${proposalsTable(s)}</div>`}
function refreshProposals(){const s=data.proposals.filter(p=>[p.number,client(p.clientId)?.brand,p.status,p.scope].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));document.getElementById('propTable').innerHTML=proposalsTable(s)}
function openProposal(id='',cid=''){if(!data.clients.length){toast('Add a client first');openClient();return}let p=proposal(id)||{clientId:cid,date:iso(),validUntil:iso(14),status:'Draft',items:[],scope:'',terms:'50% advance, balance on completion.',notes:''};openModal(id?'Edit Proposal':'New Proposal',`<form onsubmit="submitProposal(event,'${id}')"><div class="formgrid">${clientSelect(p.clientId)}${selectField('Proposal status','status',['Draft','Sent','Accepted','Rejected'],p.status)}${field('Issue date','date',p.date,'date','required')}${field('Valid until','validUntil',p.validUntil,'date')}${formItems(p.items)}${textField('Scope of work / deliverables','scope',p.scope,'maxlength="5000"')}${textField('Payment terms','terms',p.terms,'maxlength="2500"')}${textField('Notes','notes',p.notes,'maxlength="2500"')}</div>${footer('Save Proposal',id?`<button class="btn danger small" type="button" onclick="deleteProposal('${id}')">Delete</button>`:'')}</form>`)}
function submitProposal(ev,id){ev.preventDefault();let f=readForm(ev.target),items=readItems();if(!client(f.clientId)||items.some(x=>!x.name||x.qty<=0)){alert('Select a client and add valid service items');return}let p={id:id||uid(),number:proposal(id)?.number||nextDoc('PR',data.proposals),clientId:f.clientId,date:f.date,validUntil:f.validUntil,status:f.status,items,scope:f.scope.trim(),terms:f.terms.trim(),notes:f.notes.trim()};if(id)data.proposals=data.proposals.map(x=>x.id===id?p:x);else data.proposals.unshift(p);saveChanges(id?'Proposal updated':'Proposal created')}
function deleteProposal(id){if(data.invoices.some(x=>x.proposalId===id)){alert('This proposal is linked to an invoice. Keep the record for financial history.');return}if(!confirm('Delete proposal?'))return;data.proposals=data.proposals.filter(x=>x.id!==id);saveChanges('Proposal deleted')}
function viewProposal(id){let p=proposal(id);if(!p)return;openModal('Proposal · '+p.number,`<div class="kpi-line"><div><div class="small-label">Prepared for</div><div class="row-title" style="font-size:17px;margin-top:6px">${e(client(p.clientId)?.brand||'Unknown')}</div><div class="row-sub">${e(client(p.clientId)?.name||'')}</div></div>${statusBadge(p.status)}</div><div class="info-grid" style="margin:18px 0"><div class="mini-kpi"><div class="small-label">Total value</div><b>${money(subtotal(p.items))}</b></div><div class="mini-kpi"><div class="small-label">Issue date</div><b style="font-size:13px">${fmtDate(p.date)}</b></div><div class="mini-kpi"><div class="small-label">Valid until</div><b style="font-size:13px">${fmtDate(p.validUntil)}</b></div></div><div class="panel tablewrap" style="margin:15px 0"><table class="data-table" style="min-width:0"><thead><tr><th>Service</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody>${p.items.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.qty)}</td><td>${money(x.rate)}</td><td>${money(num(x.qty)*num(x.rate))}</td></tr>`).join('')}</tbody></table></div><div class="small-label">Scope of work</div><p style="white-space:pre-wrap;line-height:1.7">${e(p.scope||'—')}</p><div class="small-label">Payment terms</div><p style="white-space:pre-wrap;line-height:1.7">${e(p.terms||'—')}</p><div class="modal-actions"><div></div><div class="right"><button class="btn" onclick="printDoc('proposal','${p.id}')">${svg('file')} Print / PDF</button><button class="btn" onclick="openProposal('${p.id}')">Edit</button><button class="btn primary" onclick="convertProposal('${p.id}')">Create Invoice</button></div></div>`)}
function convertProposal(id){const p=proposal(id);if(!p)return;closeModal();openInvoice('',p.clientId,p.items,id)}
// INVOICES, PAYMENT LEDGER & WHATSAPP REMINDERS
function invoicesTable(list){return table(['Invoice','Client','Issued / Due','Amount','Received','Balance','Status','Actions'],list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<tr><td><button class="taplink" onclick="viewInvoice('${i.id}')">${e(i.number)}</button></td><td><strong>${e(client(i.clientId)?.brand||'Unknown')}</strong></td><td>${fmtDate(i.date)}<div class="row-sub">Due: ${fmtDate(i.dueDate)}</div></td><td>${money(subtotal(i.items))}</td><td>${money(paid(i.id))}</td><td><strong>${money(due(i))}</strong></td><td>${statusBadge(invStatus(i))}</td><td><div class="inline-actions"><button class="btn small" onclick="viewInvoice('${i.id}')">View</button>${due(i)>0?`<button class="btn small" onclick="openPayment('${i.id}')">+ Pay</button>`:''}</div></td></tr>`),'No invoices yet. Create one from a proposal or add a new invoice.')}
function renderInvoices(){let inv=data.invoices.filter(i=>[i.number,client(i.clientId)?.brand,invStatus(i)].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));return `<section class="metrics">${metric('Total invoiced',money(sum(data.invoices,i=>subtotal(i.items))),'Billed to customers','file')}${metric('Payments received',money(received()),`${data.payments.length} payment records`,'wallet','green')}${metric('Outstanding balance',money(outstanding()),'Unpaid and partially paid','clock','orange')}${metric('Overdue invoices',data.invoices.filter(i=>due(i)>0&&i.dueDate<iso()).length,'Past the agreed due date','receipt','red')}</section><div class="tools"><div class="tools-left"><div class="searchwrap">${svg('search')}<input class="search" value="${e(search)}" placeholder="Search invoices..." oninput="search=this.value;refreshInvoices()"></div></div><span class="muted">Click a record to see payment history</span></div><div id="invoiceTable">${invoicesTable(inv)}</div>`}
function refreshInvoices(){let inv=data.invoices.filter(i=>[i.number,client(i.clientId)?.brand,invStatus(i)].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase())));document.getElementById('invoiceTable').innerHTML=invoicesTable(inv)}
function openInvoice(id='',cid='',items=null,proposalId=''){if(!data.clients.length){toast('Add a client first');openClient();return}let inv=invoice(id)||{clientId:cid,proposalId,date:iso(),dueDate:iso(7),items:items||[],notes:'Thank you for your business.'};openModal(id?'Edit Invoice':'New Invoice',`<form onsubmit="submitInvoice(event,'${id}')"><input type="hidden" name="proposalId" value="${e(inv.proposalId||'')}"><div class="formgrid">${clientSelect(inv.clientId)}${field('Invoice issue date','date',inv.date,'date','required')}${field('Payment due date','dueDate',inv.dueDate,'date','required')}${formItems(inv.items)}${textField('Invoice notes','notes',inv.notes,'maxlength="4000"')}</div><div class="formnote">Payments are recorded separately and automatically update invoice balance. Drafting an invoice here does not send it to the client.</div>${footer('Save Invoice',id?`<button type="button" class="btn small danger" onclick="deleteInvoice('${id}')">Delete</button>`:'')}</form>`)}
function submitInvoice(ev,id){ev.preventDefault();let f=readForm(ev.target),items=readItems();if(!client(f.clientId)||items.some(x=>!x.name||x.qty<=0)){alert('Select a client and provide valid line items.');return}if(f.dueDate<f.date){alert('Due date must be on or after issue date.');return}const existing=invoice(id);if(id&&subtotal(items)+0.00001<paid(id)){alert('Invoice total cannot be less than payments already received.');return}let inv={id:id||uid(),number:existing?.number||nextDoc('INV',data.invoices),clientId:f.clientId,proposalId:existing?.proposalId||f.proposalId||'',date:f.date,dueDate:f.dueDate,items,notes:f.notes.trim()};if(id)data.invoices=data.invoices.map(x=>x.id===id?inv:x);else data.invoices.unshift(inv);saveChanges(id?'Invoice updated':'Invoice created')}
function deleteInvoice(id){if(data.payments.some(x=>x.invoiceId===id)){alert('Cannot delete an invoice with recorded payments. Preserve the payment ledger and amend the invoice if necessary.');return}if(!confirm('Delete this invoice?'))return;data.invoices=data.invoices.filter(i=>i.id!==id);saveChanges('Invoice deleted')}
function openPayment(invId){const inv=invoice(invId);if(!inv||due(inv)<=0){toast('This invoice is fully paid');return}openModal('Record Payment · '+inv.number,`<div class="soft-box" style="margin-bottom:18px"><div class="small-label">Remaining invoice balance</div><div class="metric-value" style="margin-top:7px">${money(due(inv))}</div><div class="row-sub">${e(client(inv.clientId)?.brand||'')}</div></div><form onsubmit="submitPayment(event,'${inv.id}')"><div class="formgrid">${field('Amount received (PKR) *','amount',due(inv),'number',`min="0.01" step="0.01" max="${due(inv)}" required`)}${field('Payment date','date',iso(),'date','required')}${selectField('Payment method','method',['Bank Transfer','Cash','JazzCash','Easypaisa','Card','Other'],'Bank Transfer')}${field('Reference / Notes','note','','text','maxlength="250"')}</div>${footer('Record Payment')}</form>`)}
function submitPayment(ev,invId){ev.preventDefault();const f=readForm(ev.target),i=invoice(invId),amount=Number(f.amount);if(!i||!(amount>0)||amount>due(i)+0.001){alert('Payment must be greater than zero and cannot exceed outstanding balance.');return}data.payments.unshift({id:uid(),invoiceId:invId,date:f.date,amount,method:f.method,note:f.note.trim()});saveChanges('Payment recorded successfully')}
function deletePayment(id){const p=data.payments.find(x=>x.id===id);if(!p||!confirm('Delete this payment record? This will increase the invoice balance.'))return;data.payments=data.payments.filter(x=>x.id!==id);saveChanges('Payment deleted')}
function viewInvoice(id){const i=invoice(id);if(!i)return;const c=client(i.clientId),py=data.payments.filter(p=>p.invoiceId===i.id).sort((a,b)=>b.date.localeCompare(a.date));openModal('Invoice · '+i.number,`<div class="kpi-line"><div><div class="row-title" style="font-size:17px">${e(c?.brand||'Unknown Client')}</div><div class="row-sub">${e(c?.name||'')} · ${e(c?.email||'')}</div></div>${statusBadge(invStatus(i))}</div><div class="info-grid" style="margin:20px 0"><div class="mini-kpi"><div class="small-label">Invoice Total</div><b>${money(subtotal(i.items))}</b><small>Issued ${fmtDate(i.date)}</small></div><div class="mini-kpi"><div class="small-label">Received</div><b>${money(paid(i.id))}</b><small>${py.length} payment(s)</small></div><div class="mini-kpi"><div class="small-label">Outstanding</div><b style="color:#bb7d26">${money(due(i))}</b><small>Due ${fmtDate(i.dueDate)}</small></div></div><div class="small-label" style="margin-bottom:10px">Services</div><div class="panel tablewrap"><table class="data-table" style="min-width:0"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.qty)}</td><td>${money(x.rate)}</td><td>${money(num(x.qty)*num(x.rate))}</td></tr>`).join('')}</tbody></table></div><div class="kpi-line" style="margin:22px 0 12px"><strong>Payment history</strong>${due(i)>0?`<button class="btn small primary" onclick="openPayment('${i.id}')">+ Record Payment</button>`:''}</div><div class="panel tablewrap"><table class="data-table" style="min-width:0"><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Actions</th></tr></thead><tbody>${py.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><strong>${money(x.amount)}</strong></td><td>${e(x.method)}<div class="row-sub">${e(x.note)}</div></td><td><button class="btn small danger" onclick="deletePayment('${x.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">No payments recorded.</div></td></tr>'}</tbody></table></div><div class="modal-actions"><div></div><div class="right"><button class="btn" onclick="printDoc('invoice','${i.id}')">Print / PDF</button>${due(i)>0?`<button class="btn" onclick="sendWhatsApp('${i.id}')">${svg('message')} WhatsApp</button>`:''}<button class="btn" onclick="openInvoice('${i.id}')">Edit</button></div></div>`)}
function whatsappNumber(phone){let digits=String(phone||'').replace(/\D/g,'');if(digits.startsWith('00'))digits=digits.slice(2);if(digits.startsWith('0')&&digits.length===11)digits='92'+digits.slice(1);return /^\d{10,15}$/.test(digits)?digits:''}
function reminderText(inv){const c=client(inv.clientId),company=data.settings.company||'Our Team';return `Hello ${c?.name||'there'},\n\nThis is a friendly payment reminder from ${company}.\n\nInvoice: ${inv.number}\nBrand: ${c?.brand||''}\nTotal amount: ${money(subtotal(inv.items))}\nAmount received: ${money(paid(inv.id))}\nOutstanding: ${money(due(inv))}\nDue date: ${fmtDate(inv.dueDate)}\n\nPlease let us know once payment has been completed. If you have already paid, kindly disregard this reminder.\n\nThank you,\n${company}`}
function sendWhatsApp(id){const inv=invoice(id),c=inv&&client(inv.clientId);if(!inv||!c)return;const n=whatsappNumber(c.phone);if(!n){alert('Add a valid mobile number with country code to this client profile (for Pakistan, 03XX or +92...).');return}const url=`https://wa.me/${n}?text=${encodeURIComponent(reminderText(inv))}`;window.open(url,'_blank','noopener,noreferrer');toast('WhatsApp opened with a draft message. You must press Send yourself.')}

function submitExpense(ev,id){ev.preventDefault();let f=readForm(ev.target),amount=Number(f.amount);if(!(amount>0))return;let x={id:id||uid(),clientId:f.clientId,category:f.category,project:f.project.trim(),amount,date:f.date,note:f.note.trim()};if(id)data.expenses=data.expenses.map(y=>y.id===id?x:y);else data.expenses.unshift(x);saveChanges('Expense saved')}

function openTask(){openModal('Add Follow-up Task',`<form onsubmit="submitTask(event)"><div class="formgrid">${field('Task title *','title','','text','required maxlength="250"',true)}${field('Due date','due',iso(1),'date','required')}${selectField('Related client','clientId',[['','None'],...data.clients.map(c=>[c.id,c.brand])],'')}${selectField('Related lead','leadId',[['','None'],...data.leads.map(l=>[l.id,l.company])],'')}</div>${footer('Save Task')}</form>`)}
function submitTask(ev){ev.preventDefault();let f=readForm(ev.target);if(!f.title.trim())return;data.tasks.unshift({id:uid(),title:f.title.trim(),due:f.due,clientId:f.clientId,leadId:f.leadId,done:false});saveChanges('Task created')}
function toggleTask(id,done){let t=data.tasks.find(t=>t.id===id);if(t){t.done=done;save();render()}}

function renderReports(){const billed=sum(data.invoices,i=>subtotal(i.items));const gross=received()-totalExpense();const byClient=data.clients.map(c=>({c,billed:clBilled(c.id),received:clReceived(c.id),due:clDue(c.id),expenses:clExpenses(c.id)})).sort((a,b)=>b.received-a.received);const chart=byClient.slice(0,5);const max=Math.max(1,...chart.map(x=>Math.max(x.received,x.expenses)));return `<div class="notice"><strong>Accounting note:</strong> “Cash surplus” = payments actually received − expenses recorded. It is not audited net profit, and excludes tax, depreciation, liabilities, and any missing overhead. Unpaid invoices are shown as receivables, not cash earned.</div><section class="metrics">${metric('Total invoiced',money(billed),'Invoice value, including unpaid','file')}${metric('Cash received',money(received()),'Recorded client payments','wallet','green')}${metric('Total expenses',money(totalExpense()),'All allocated & overhead costs','receipt','red')}${metric('Cash surplus',money(gross),'Received less expenses','trend',gross>=0?'green':'red')}</section>
 <div class="two-col"><section class="panel"><div class="panelhead"><div><h2>Income vs direct client expenses</h2><p>Lifetime receipts and tracked direct costs</p></div></div><div class="panelbody">${chart.map(x=>`<div style="padding:12px 0"><div class="kpi-line"><strong style="font-size:12px">${e(x.c.brand)}</strong><span class="muted" style="font-size:11px">${money(x.received)} received</span></div><div class="bartrack" style="margin-top:9px"><div class="barpart" style="width:${100*x.received/max}%"></div></div><div class="bartrack" style="margin-top:5px"><div class="barpart expense" style="width:${100*x.expenses/max}%"></div></div></div>`).join('')||'<div class="empty">No clients yet.</div>'}<div class="inline-actions" style="margin-top:12px"><div class="barlegend"><i></i><span class="muted" style="font-size:11px">Received</span></div><div class="barlegend expense"><i></i><span class="muted" style="font-size:11px">Expenses</span></div></div></div></section>
 <section class="panel"><div class="panelhead"><div><h2>Receivables & profitability</h2><p>Know exactly what is still pending</p></div></div><div class="panelbody"><div class="list-values"><span class="key">Invoiced</span><span class="val">${money(billed)}</span></div><div class="list-values"><span class="key">Received</span><span class="val">${money(received())}</span></div><div class="list-values"><span class="key">Outstanding</span><span class="val" style="color:#b58024">${money(outstanding())}</span></div><div class="list-values"><span class="key">Client-assigned costs</span><span class="val">${money(sum(data.expenses.filter(x=>x.clientId),x=>x.amount))}</span></div><div class="list-values"><span class="key">General overhead</span><span class="val">${money(sum(data.expenses.filter(x=>!x.clientId),x=>x.amount))}</span></div><div class="list-values"><span class="key">Cash surplus</span><span class="val" style="color:${gross>=0?'#228966':'#ca5062'}">${money(gross)}</span></div></div></section></div>
 <div class="section-space"><div class="panelhead" style="padding-left:0"><div><h2>Client lifetime performance</h2><p>Per-client billed, earned, pending and direct costs</p></div></div>${table(['Client / Brand','Total Billed','Total Received','Outstanding','Direct Expenses','Cash Contribution','Profile'],byClient.map(x=>`<tr><td><strong>${e(x.c.brand)}</strong><div class="row-sub">${e(x.c.name)}</div></td><td>${money(x.billed)}</td><td>${money(x.received)}</td><td>${money(x.due)}</td><td>${money(x.expenses)}</td><td><strong style="color:${x.received-x.expenses>=0?'#258766':'#bd4c5e'}">${money(x.received-x.expenses)}</strong></td><td><button class="btn small" onclick="navigate('client','${x.c.id}')">View</button></td></tr>`),'No clients to report yet.')}</div>`}

function applyAgencyLogo(){
  const candidate=String(data.settings?.brandLogo||'');
  const safe=/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(candidate)&&candidate.length<=240000;
  const src=safe?candidate:'./as-tech-agency-logo.png';
  document.querySelectorAll('.brandmark').forEach(mark=>{
    mark.classList.add('logo-loaded');
    mark.replaceChildren(Object.assign(document.createElement('img'),{src,alt:'AS Tech Agency logo'}));
  });
}
function uploadAgencyLogo(event){
  const file=event.target.files?.[0];
  if(!file)return;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>5*1024*1024){alert('Select a PNG, JPG, or WEBP logo smaller than 5 MB.');event.target.value='';return;}
  const image=new Image(), objectUrl=URL.createObjectURL(file);
  image.onload=()=>{
    try{
      const maxW=460,maxH=180,ratio=Math.min(1,maxW/image.width,maxH/image.height);
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      const result=canvas.toDataURL('image/png');
      if(result.length>220000)throw Error('Logo is too large. Please upload a simpler/transparent PNG.');
      data.settings=data.settings||{};
      data.settings.brandLogo=result;save();applyAgencyLogo();toast('Agency logo saved. Cloud sync will upload the change.');
    }catch(err){alert(err.message||'Could not read image');}
    finally{URL.revokeObjectURL(objectUrl);event.target.value='';}
  };
  image.onerror=()=>{URL.revokeObjectURL(objectUrl);alert('Could not open logo image.');event.target.value='';};
  image.src=objectUrl;
}
function removeAgencyLogo(){
  if(!data.settings?.brandLogo)return;
  if(!confirm('Remove the logo from CRM header?'))return;
  delete data.settings.brandLogo;save();applyAgencyLogo();toast('Logo removed.');
}
function renderSettings(){let s=data.settings||{};return `<div class="notice"><strong>Use on Laptop + Mobile (Free):</strong> On your laptop, use the standalone HTML file. For mobile, publish these static files on a free HTTPS site (for example GitHub Pages) and open the link in Safari/Chrome. Data lives separately in each device's browser, even if both open the same website. To move data: <strong>Settings → Download Full Backup</strong> on device A, transfer the JSON file to device B, then <strong>Settings → Import Backup</strong>. Import replaces the data on device B, so back up BOTH devices first. Cloud Sync V2.2 is optional: click the floating Cloud button, configure Supabase, and sign in on both devices. Once connected, changes sync over the internet. Offline edits remain local until you reconnect. Export JSON backups regularly. Without Cloud login, devices stay separate. A hosted website can be added to your home screen and used offline after first load.</div><div class="notice warning"><strong>Offline prototype, not a secure hosted CRM.</strong> Records are stored in this browser only. Do not rely on this for sensitive real customer data; no authentication, encrypted database, synced backups, payment collection or background WhatsApp sending is connected. Export backups regularly.</div><div class="panel"><div class="setting-card"><h3>Agency Logo</h3><p>Upload the original agency logo (PNG or JPG) to display it in the desktop and mobile CRM headers. The logo is stored in your CRM settings and syncs to your signed-in devices.</p><div class="brand-logo-controls"><input type="file" accept="image/png,image/jpeg,image/webp" aria-label="Upload agency logo" onchange="uploadAgencyLogo(event)"><button type="button" class="btn small" onclick="removeAgencyLogo()">Remove Logo</button></div><div class="muted">Image will be resized to reduce storage usage. Avoid uploading confidential images.</div></div><div class="setting-card"><h3>Company / Invoice Identity</h3><p>These fields appear on proposals, invoices and WhatsApp reminder drafts.</p><form onsubmit="saveSettings(event)"><div class="formgrid">${field('Company name','company',s.company||'AS Tech Agency','text','required maxlength="150"')}${field('Business email','email',s.email||'','email')}${field('Business phone','phone',s.phone||'','tel')}${field('Company address','address',s.address||'','text','',true)}</div><div style="margin-top:16px"><button class="btn primary" type="submit">Save Company Details</button></div></form></div><div class="setting-card"><h3>Backup & Restore</h3><p>Export all clients, social accounts, leads, proposals, invoices, payments, expenses and follow-ups as a JSON file. Restore a V1 leads backup or a complete V2 backup on this or another browser. A backup import replaces existing data.</p><div class="stackbtn"><button class="btn" onclick="exportJSON()">${svg('download')} Download Full Backup</button><button class="btn" onclick="document.getElementById('backupInput').click()">Import Backup</button><input type="file" hidden id="backupInput" accept="application/json,.json" onchange="importJSON(this)"></div></div><div class="setting-card"><h3>CSV Exports</h3><p>Download individual categories for use in Excel or Google Sheets.</p><div class="stackbtn"><button class="btn" onclick="exportCSV('clients')">Clients CSV</button><button class="btn" onclick="exportCSV('invoices')">Invoices CSV</button><button class="btn" onclick="exportCSV('payments')">Payments CSV</button><button class="btn" onclick="exportCSV('expenses')">Expenses CSV</button><button class="btn" onclick="exportCSV('socials')">Social Accounts CSV</button><button class="btn" onclick="exportCSV('leads')">Leads CSV</button></div></div><div class="setting-card"><h3>Demo Controls</h3><p>The fictional sample records are for demonstration only. Reset restores the sample workspace. Clear removes all records. Export a backup before replacing any data.</p><div class="stackbtn"><button class="btn danger" onclick="resetDemo()">Reset to Demo Data</button><button class="btn danger" onclick="clearAll()">Clear All Records</button></div></div></div>`}
function saveSettings(ev){ev.preventDefault();const f=readForm(ev.target);data.settings={company:f.company.trim(),email:f.email.trim(),phone:f.phone.trim(),address:f.address.trim()};save();render();toast('Company details updated')}
function exportFile(filename,body,type='application/json'){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportJSON(){exportFile('AS-CRM-V2-backup-'+iso()+'.json',JSON.stringify({...data,version:2,exportedAt:new Date().toISOString()},null,2));toast('Backup downloaded')}
function csvCell(v){let x=String(v??'');if(/^[=+@\-\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}
function downloadCSV(name,headers,rows){const csv='\ufeff'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');exportFile('AS-CRM-'+name+'-'+iso()+'.csv',csv,'text/csv;charset=utf-8');toast('CSV downloaded')}
function exportCSV(kind){const rows=(data[kind]||[]);if(!rows.length){toast('No records to export');return}let heads=Object.keys(rows.reduce((acc,row)=>{Object.keys(row).forEach(k=>acc[k]=true);return acc},{}));downloadCSV(kind,heads,rows.map(row=>heads.map(h=>Array.isArray(row[h])?JSON.stringify(row[h]):row[h])))}
function exportReport(){downloadCSV('client-report',['Client','Brand','Billed','Received','Outstanding','Direct Expenses','Cash Contribution'],data.clients.map(c=>[c.name,c.brand,clBilled(c.id),clReceived(c.id),clDue(c.id),clExpenses(c.id),clReceived(c.id)-clExpenses(c.id)]))}
async function importJSON(input){const file=input.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Maximum supported backup size is 5 MB.');let d=JSON.parse(await file.text());const keys=['clients','leads','tasks','socials','proposals','invoices','payments','expenses'];const isV1=d&&Array.isArray(d.leads)&&Array.isArray(d.tasks)&&!Array.isArray(d.clients);if(isV1){if(!d.leads.every(l=>typeof l.id==='string'&&typeof l.company==='string'&&typeof l.contact==='string'))throw Error('Invalid V1 lead records.');let upgraded=emptyData();upgraded.leads=d.leads;upgraded.tasks=d.tasks.map(t=>({...t,clientId:t.clientId||''}));upgraded.clients=d.leads.filter(l=>l.stage==='Won').map(l=>({id:uid(),name:l.contact,brand:l.company,email:l.email||'',phone:l.phone||'',address:'',status:'Active',startDate:l.created||iso(),notes:l.notes||''}));d=upgraded}else if(!d||!keys.every(k=>Array.isArray(d[k])&&d[k].length<=10000))throw Error('This is not an AS CRM V1/V2 backup.');if(!d.clients.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&typeof c.brand==='string')||!d.invoices.every(i=>typeof i.id==='string'&&Array.isArray(i.items)&&typeof i.clientId==='string')||!d.payments.every(p=>typeof p.invoiceId==='string'&&Number.isFinite(Number(p.amount))))throw Error('Backup fields are incomplete.');if(!confirm((isV1?'V1 backup detected: won leads will become clients, other leads and tasks will be imported. ': '')+'Replace ALL current local data with this backup?'))return;data={...d,settings:{...seed().settings,...(d.settings||{})},version:2};page='dashboard';save();render();toast(isV1?'V1 backup migrated to V2':'Backup restored successfully')}catch(err){alert('Import failed: '+err.message)}finally{input.value=''}}
function resetDemo(){if(!confirm('Reset ALL local records to fictional demo data?'))return;data=seed();page='dashboard';save();render();toast('Demo restored')}
function clearAll(){if(!confirm('Delete ALL local records? Export a backup first.'))return;data=emptyData();page='dashboard';save();render();toast('All records cleared')}

function printDoc(type,id){const d=type==='invoice'?invoice(id):proposal(id);if(!d)return;const c=client(d.clientId),isInvoice=type==='invoice',company=data.settings||{};let total=subtotal(d.items);const lines=d.items.map((x,n)=>`<tr><td>${n+1}. ${e(x.name)}</td><td style="text-align:center">${e(x.qty)}</td><td style="text-align:right">${money(x.rate)}</td><td style="text-align:right">${money(num(x.qty)*num(x.rate))}</td></tr>`).join('');const title=isInvoice?'INVOICE':'PROPOSAL';let html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${title} ${e(d.number)}</title><style>@page{size:A4;margin:16mm}body{font-family:Arial,sans-serif;color:#1d2b43;margin:0;font-size:12px}.logo{font-size:24px;font-weight:850;letter-spacing:-1px;color:#294ed8}.header{display:flex;justify-content:space-between;border-bottom:3px solid #294ed8;padding-bottom:20px;gap:30px}.muted{color:#7a879a;line-height:1.65}.right{text-align:right}.subhead{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#95a0b1;font-weight:700}.col{width:49%}.flex{display:flex;justify-content:space-between;margin-top:25px;gap:20px}table{margin-top:28px;border-collapse:collapse;width:100%}th{text-align:left;background:#f1f5ff;color:#50617f;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:13px 10px}td{padding:14px 10px;border-bottom:1px solid #e8edf5;vertical-align:top}.total{text-align:right;margin:24px 0}.big{font-size:24px;font-weight:800}.textblock{margin-top:28px;white-space:pre-wrap;line-height:1.75}.textblock b{display:block;margin-bottom:8px}.foot{border-top:1px solid #e1e7f0;margin-top:42px;padding-top:15px;color:#9ba5b3;text-align:center;font-size:10px}@media print{button{display:none}}</style></head><body><div class="header"><div><div class="logo">${e(company.company||'AS CRM')}</div><div class="muted">${e(company.address||'')}<br>${e(company.email||'')}<br>${e(company.phone||'')}</div></div><div class="right"><div style="font-size:28px;font-weight:800">${title}</div><div style="margin-top:10px"><b>${e(d.number)}</b></div><div class="muted">Issued ${fmtDate(d.date)}<br>${isInvoice?'Due':'Valid until'} ${fmtDate(isInvoice?d.dueDate:d.validUntil)}</div></div></div><div class="flex"><div class="col"><div class="subhead">Prepared for</div><h2 style="font-size:17px;margin:8px 0">${e(c?.brand||'Client')}</h2><div class="muted">${e(c?.name||'')}<br>${e(c?.email||'')}<br>${e(c?.phone||'')}<br>${e(c?.address||'')}</div></div><div class="col right"><div class="subhead">${isInvoice?'Payment status':'Proposal status'}</div><h2 style="font-size:16px">${e(isInvoice?invStatus(d):d.status)}</h2></div></div><table><thead><tr><th>Service / Description</th><th style="text-align:center">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead><tbody>${lines}</tbody></table><div class="total"><div class="big">Total: ${money(total)}</div>${isInvoice?`<p class="muted">Payments received: ${money(paid(d.id))}<br><b>Balance due: ${money(due(d))}</b></p>`:''}</div>${isInvoice?`<div class="textblock"><b>Notes</b>${e(d.notes||'Thank you for your business.')}</div>`:`<div class="textblock"><b>Scope of work</b>${e(d.scope||'—')}</div><div class="textblock"><b>Payment terms</b>${e(d.terms||'—')}</div><div class="textblock"><b>Additional notes</b>${e(d.notes||'—')}</div>`}<div class="foot">Document generated by AS CRM V2 · ${e(company.company||'Your Business')}</div><script>window.addEventListener('load',()=>setTimeout(()=>window.print(),300));<\/script></body></html>`;let w=window.open('','_blank');if(!w){alert('Allow popups to print or save this document as PDF.');return}w.document.open();w.document.write(html);w.document.close()}

// PHONE NAVIGATION: local-only, no remote calls.
function toggleMobileMenu(){document.body.classList.toggle('mobile-menu-open');updateMobileNav()}
function closeMobileMenu(){document.body.classList.remove('mobile-menu-open');updateMobileNav()}
function updateMobileNav(){const menu=document.body.classList.contains('mobile-menu-open');document.querySelectorAll('[data-mobilepage]').forEach(btn=>{const key=btn.dataset.mobilepage;const active=key==='more'?menu:!menu&&(page===key||(key==='clients'&&page==='client'));btn.classList.toggle('active',active);btn.setAttribute('aria-current',active?'page':'false')})}
if('serviceWorker' in navigator && ['https:','http:'].includes(location.protocol)){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}

save();render();updateMobileNav();applyAgencyLogo();
